env_file:
  - path: .env.docker
    required: false

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./wiclawhub.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - FRONTEND_URL=${SITE_URL:-http://localhost}
      - CORS_ORIGINS=["${SITE_URL:-http://localhost}","http://localhost","http://localhost:3000"]
      - DEBUG=false
    volumes:
      - db-data:/app

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
