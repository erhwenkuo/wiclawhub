env_file:
  - path: .env.docker
    required: false

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wiclawhub
      POSTGRES_USER: wiclawhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiclawhub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiclawhub"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://wiclawhub:${POSTGRES_PASSWORD:-wiclawhub}@db:5432/wiclawhub
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - FRONTEND_URL=${SITE_URL:-http://localhost}
      - CORS_ORIGINS=["${SITE_URL:-http://localhost}","http://localhost","http://localhost:3000"]
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
